  <style>
:root {
  --bg: #16130F;
  --surface: #221D17;
  --surface-2: #1B1713;
  --track: #2C261F;
  --line: #3A3229;
  --line-strong: #5A4E40;
  --text: #F2E9DA;
  --muted: #B5A893;
  --faint: #8C8070;
  --accent: #E3A645;
  --accent-ink: #16130F;
  --danger: #E07A5F;
  --paper: #EDE4D3;
  --serif: 'Noto Serif Thai', Georgia, serif;
  --sans: 'IBM Plex Sans Thai', system-ui, -apple-system, sans-serif;
  --nav-h: 72px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); }
body {
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
img { display: block; max-width: 100%; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { max-width: 480px; margin: 0 auto; min-height: 100%; position: relative; }
#view { padding-bottom: calc(var(--nav-h) + var(--safe-b) + 16px); outline: none; min-height: 100vh; }

/* ---------- header ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: calc(20px + var(--safe-t)) 20px 8px; }
.eyebrow { font-size: 11px; letter-spacing: .18em; color: var(--muted); font-weight: 600; }
.page-title { font-family: var(--serif); font-size: 26px; font-weight: 700; line-height: 1.25; }
.bar-head { display: flex; align-items: center; justify-content: space-between; padding: calc(10px + var(--safe-t)) 8px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
.bar-head h1 { font-family: var(--serif); font-size: 19px; font-weight: 700; }

/* ---------- buttons ---------- */
.icon-btn { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.icon-btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.icon-btn svg { width: 20px; height: 20px; }
.btn { min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500; text-decoration: none; color: var(--text); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--danger); border-color: #5A3328; background: transparent; }
.btn.block { width: 100%; min-height: 52px; border-radius: 14px; font-size: 16px; }
.btn.small { min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.text-btn { min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: 15px; }
.pill { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 0 14px; min-height: 36px; font-size: 13px; white-space: nowrap; flex-shrink: 0; }
.pill[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); font-weight: 600; }
.pill:disabled { opacity: .35; }

/* ---------- bottom nav ---------- */
#nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; background: var(--surface-2); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); }
#nav .nav-inner { width: 100%; max-width: 480px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 6px 8px 8px; height: var(--nav-h); }
#nav a { color: var(--muted); text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; min-height: 48px; }
#nav a[aria-current="page"] { color: var(--accent); }
#nav a svg { width: 22px; height: 22px; }
#nav a.fab { justify-self: center; width: 56px; height: 56px; min-height: 0; border-radius: 28px; background: var(--accent); color: var(--accent-ink); margin-top: -22px; box-shadow: 0 8px 20px rgba(0,0,0,.45); }
#nav a.fab svg { width: 26px; height: 26px; }
body.hide-nav #nav { display: none; }
body.hide-nav #view { padding-bottom: calc(24px + var(--safe-b)); }

/* ---------- toast ---------- */
#toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--safe-b) + 18px); transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 100; max-width: calc(100vw - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- home / carousel ---------- */
.home-meta { display: flex; justify-content: space-between; align-items: center; padding: 2px 20px 0; font-size: 13px; color: var(--muted); gap: 8px; }
.carousel { position: relative; height: 262px; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.c-item { position: absolute; left: 50%; top: 18px; width: 220px; height: 220px; margin-left: -110px; padding: 0; border: 0; background: transparent; transition: transform .34s cubic-bezier(.2,.8,.2,1), opacity .34s; will-change: transform; }
.c-item[data-off="0"] { z-index: 3; }
.c-item[data-off="-1"], .c-item[data-off="1"] { z-index: 2; opacity: .5; }
.c-item[data-off="hidden"] { opacity: 0; pointer-events: none; z-index: 1; }
.c-disc { position: absolute; top: 8px; left: 6px; width: 204px; height: 204px; border-radius: 50%; background: repeating-radial-gradient(circle, #0B0A08 0 2px, #1E1A16 2px 3.5px); display: none; align-items: center; justify-content: center; }
.c-item[data-off="0"] .c-disc { display: flex; animation: discOut .52s .14s cubic-bezier(.2,.8,.2,1) both; }
.c-disc-label { width: 72px; height: 72px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; }
.c-disc-label::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #0B0A08; }
@keyframes discOut { from { transform: translateX(0) rotate(0); } to { transform: translateX(62px) rotate(40deg); } }
.c-face { position: absolute; inset: 0; border-radius: 6px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.55); background: var(--surface); }
.c-face img { width: 100%; height: 100%; object-fit: cover; }
.c-face.mine { border-radius: 3px; transform: rotate(-2deg); }
.c-face.flip { animation: faceIn .3s ease-out both; }
.c-face.mine.flip { animation-name: mineIn; }
@keyframes faceIn { from { transform: perspective(700px) rotateY(70deg); opacity: .4; } to { transform: perspective(700px) rotateY(0); opacity: 1; } }
@keyframes mineIn { from { transform: perspective(700px) rotateY(70deg) rotate(-2deg); opacity: .4; } to { transform: perspective(700px) rotateY(0) rotate(-2deg); opacity: 1; } }
.c-badge { position: absolute; top: -10px; right: -6px; z-index: 4; background: var(--bg); border: 1px solid var(--line); color: var(--text); font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 999px; white-space: nowrap; display: none; }
.c-item[data-off="0"] .c-badge { display: block; }
.ph-cover { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 14px; text-align: left; color: #fff; }

    format: FORMAT,
    version: 1,
    exportedAt: new Date().toISOString(),
    settings: { defaultFace: state.settings.defaultFace, sort: state.settings.sort },
    records,
    images: imageMeta,
  };
  entries.unshift({ name: 'data.json', data: new TextEncoder().encode(JSON.stringify(data, null, 1)) });
  const blob = createZip(entries);
  await setSetting('lastBackupAt', Date.now());
  const stamp = new Date().toISOString().slice(0, 10);
  return { blob, filename: `vinyl-crate-backup-${stamp}.zip`, count: records.length };
