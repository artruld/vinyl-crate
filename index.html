  <style>
:root {
  --bg: #16130F;
  --surface: #221D17;
  --surface-2: #1B1713;
  --track: #2C261F;
  --line: #3A3229;
  --line-strong: #5A4E40;
  --text: #F2E9DA;
  --muted: #B5A893;
  --faint: #8C8070;
  --accent: #E3A645;
  --accent-ink: #16130F;
  --danger: #E07A5F;
  --paper: #EDE4D3;
  --serif: 'Noto Serif Thai', Georgia, serif;
  --sans: 'IBM Plex Sans Thai', system-ui, -apple-system, sans-serif;
  --nav-h: 72px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); }
body {
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
img { display: block; max-width: 100%; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { max-width: 480px; margin: 0 auto; min-height: 100%; position: relative; }
#view { padding-bottom: calc(var(--nav-h) + var(--safe-b) + 16px); outline: none; min-height: 100vh; }

/* ---------- header ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: calc(20px + var(--safe-t)) 20px 8px; }
.eyebrow { font-size: 11px; letter-spacing: .18em; color: var(--muted); font-weight: 600; }
.page-title { font-family: var(--serif); font-size: 26px; font-weight: 700; line-height: 1.25; }
.bar-head { display: flex; align-items: center; justify-content: space-between; padding: calc(10px + var(--safe-t)) 8px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
.bar-head h1 { font-family: var(--serif); font-size: 19px; font-weight: 700; }

/* ---------- buttons ---------- */
.icon-btn { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.icon-btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.icon-btn svg { width: 20px; height: 20px; }
.btn { min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500; text-decoration: none; color: var(--text); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--danger); border-color: #5A3328; background: transparent; }
.btn.block { width: 100%; min-height: 52px; border-radius: 14px; font-size: 16px; }
.btn.small { min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.text-btn { min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: 15px; }
.pill { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 0 14px; min-height: 36px; font-size: 13px; white-space: nowrap; flex-shrink: 0; }
.pill[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); font-weight: 600; }
.pill:disabled { opacity: .35; }

/* ---------- bottom nav ---------- */
#nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; background: var(--surface-2); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); }
#nav .nav-inner { width: 100%; max-width: 480px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 6px 8px 8px; height: var(--nav-h); }
#nav a { color: var(--muted); text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; min-height: 48px; }
#nav a[aria-current="page"] { color: var(--accent); }
#nav a svg { width: 22px; height: 22px; }
#nav a.fab { justify-self: center; width: 56px; height: 56px; min-height: 0; border-radius: 28px; background: var(--accent); color: var(--accent-ink); margin-top: -22px; box-shadow: 0 8px 20px rgba(0,0,0,.45); }
#nav a.fab svg { width: 26px; height: 26px; }
body.hide-nav #nav { display: none; }
body.hide-nav #view { padding-bottom: calc(24px + var(--safe-b)); }

/* ---------- toast ---------- */
#toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--safe-b) + 18px); transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 100; max-width: calc(100vw - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- home / carousel ---------- */
.home-meta { display: flex; justify-content: space-between; align-items: center; padding: 2px 20px 0; font-size: 13px; color: var(--muted); gap: 8px; }
.carousel { position: relative; height: 262px; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none; perspective: 900px; perspective-origin: 50% 45%; }
.c-item { position: absolute; left: 50%; top: 18px; width: 220px; height: 220px; margin-left: -110px; padding: 0; border: 0; background: transparent; will-change: transform, opacity; transform-style: preserve-3d; -webkit-tap-highlight-color: transparent; }
.c-disc { position: absolute; top: 8px; left: 6px; width: 204px; height: 204px; border-radius: 50%; background: repeating-radial-gradient(circle, #0B0A08 0 2px, #1E1A16 2px 3.5px); display: flex; align-items: center; justify-content: center; opacity: 0; transform: translateX(0) rotate(0); transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .2s; }
.c-item.current .c-disc { opacity: 1; transform: translateX(62px) rotate(40deg); transition-delay: .05s; }
.carousel.dragging .c-item .c-disc { opacity: 0; transform: translateX(0) rotate(0); transition-delay: 0s; transition-duration: .2s; }
.c-disc-label { width: 72px; height: 72px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; }
.c-disc-label::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #0B0A08; }
.c-disc.cd { background: conic-gradient(from 30deg, #d9d6e8, #f4efe4, #b7d6e6, #e8c9e2, #f6f0d8, #c4e0d4, #d9d6e8); box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }
.c-disc.cd .c-disc-label { width: 64px; height: 64px; background: rgba(240,240,245,.55) !important; box-shadow: inset 0 0 0 10px rgba(255,255,255,.35); }
.c-disc.cd .c-disc-label::after { width: 22px; height: 22px; background: var(--bg); }
.c-item.is-cd .c-face { border-radius: 3px; box-shadow: 0 18px 40px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.18); }
.c-item.is-cd .c-face::after { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.16) 0 18%, transparent 30%); pointer-events: none; }
.c-item.is-cd .c-face::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: rgba(0,0,0,.35); z-index: 1; }
.c-face { position: absolute; inset: 0; border-radius: 6px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.55); background: var(--surface); }
.c-face img { width: 100%; height: 100%; object-fit: cover; }

    Math.min(left, right) / Math.max(left, right) >= 0.55 &&
    aspect >= 0.55 && aspect <= 1.8;
  const squareness = 1 - Math.min(1, Math.abs(Math.log(aspect)) / 0.6);
  return { ok, af, area, aspect, squareness };
}

/** Fraction of each side that lies on a detected edge. */
function sideSupport(q, edge, w, h) {
  const one = (a, b) => {
    const n = Math.max(16, Math.round(dist(a, b) / 2));
    let hit = 0;
    let cnt = 0;
    for (let k = 0; k <= n; k++) {
      const f = 0.06 + (0.88 * k) / n;
      const x = Math.round(a.x + (b.x - a.x) * f);
      const y = Math.round(a.y + (b.y - a.y) * f);
      if (x < 2 || y < 2 || x >= w - 2 || y >= h - 2) continue;
      cnt++;
      let found = false;
      for (let dy = -2; dy <= 2 && !found; dy++) for (let dx = -2; dx <= 2; dx++) if (edge[(y + dy) * w + x + dx]) { found = true; break; }
      if (found) hit++;
    }
    return cnt < n * 0.5 ? 0 : hit / cnt;
  };
  const sup = [one(q[0], q[1]), one(q[1], q[2]), one(q[2], q[3]), one(q[3], q[0])];
  return { sup, min: Math.min(...sup), mean: sup.reduce((s, v) => s + v, 0) / 4 };
}

function prepare(src) {
  const maxS = 360;
  const sc = Math.min(1, maxS / Math.max(src.width, src.height));
  const w = Math.max(16, Math.round(src.width * sc));
  const h = Math.max(16, Math.round(src.height * sc));
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(src, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h).data;

  let gray = new Float32Array(w * h);
  for (let i = 0, j = 0; i < gray.length; i++, j += 4) gray[i] = 0.299 * data[j] + 0.587 * data[j + 1] + 0.114 * data[j + 2];
  gray = boxBlur(boxBlur(gray, w, h, 1), w, h, 1);

  const mag = new Float32Array(w * h);
  const ang = new Float32Array(w * h);
  const hist = new Uint32Array(512);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const gx = -gray[i - w - 1] - 2 * gray[i - 1] - gray[i + w - 1] + gray[i - w + 1] + 2 * gray[i + 1] + gray[i + w + 1];
      const gy = -gray[i - w - 1] - 2 * gray[i - w] - gray[i - w + 1] + gray[i + w - 1] + 2 * gray[i + w] + gray[i + w + 1];
      const m = Math.hypot(gx, gy);
      mag[i] = m;
      ang[i] = Math.atan2(gy, gx);
      hist[Math.min(511, (m / 2) | 0)]++;
    }
  }
  const total = (w - 2) * (h - 2);
  let cum = 0;
  let p99 = 1022;
  for (let v = 0; v < 512; v++) { cum += hist[v]; if (cum >= total * 0.99) { p99 = v * 2; break; } }
  const thr = Math.max(16, p99 * 0.1);

  // Thin edges (non-maximum suppression along the gradient), like Canny
  const edge = new Uint8Array(w * h);
  for (let y = 2; y < h - 2; y++) {
    for (let x = 2; x < w - 2; x++) {
      const i = y * w + x;
      const m = mag[i];
      if (m < thr) continue;
      let a = (ang[i] * 180) / Math.PI;
      if (a < 0) a += 180;
      let n1, n2;
      if (a < 22.5 || a >= 157.5) { n1 = mag[i - 1]; n2 = mag[i + 1]; }
      else if (a < 67.5) { n1 = mag[i - w - 1]; n2 = mag[i + w + 1]; }
      else if (a < 112.5) { n1 = mag[i - w]; n2 = mag[i + w]; }
      else { n1 = mag[i - w + 1]; n2 = mag[i + w - 1]; }
      if (m >= n1 && m >= n2) edge[i] = 1;
    }
  }
  return { w, h, sc, data, edge, ang };
}

// --- method 1: straight lines (Hough transform) ---
function quadFromLines(P) {
  const { w, h, edge, ang } = P;
  const nT = 180;
  const diag = Math.ceil(Math.hypot(w, h));
  const nR = 2 * diag + 1;
  const cosT = new Float32Array(nT);
  const sinT = new Float32Array(nT);
  for (let t = 0; t < nT; t++) { cosT[t] = Math.cos((t * Math.PI) / 180); sinT[t] = Math.sin((t * Math.PI) / 180); }
  const acc = new Uint16Array(nT * nR);
  for (let y = 2; y < h - 2; y++) {
    for (let x = 2; x < w - 2; x++) {
      const i = y * w + x;
      if (!edge[i]) continue;
      let t0 = Math.round((ang[i] * 180) / Math.PI);
      t0 = ((t0 % 180) + 180) % 180;
      for (let k = -12; k <= 12; k++) {
        const t = (t0 + k + 180) % 180;
        acc[t * nR + Math.round(x * cosT[t] + y * sinT[t]) + diag]++;
      }
    }
  }
  const minVotes = Math.max(12, Math.round(Math.min(w, h) * 0.18));
  const peaks = [];
  for (let t = 0; t < nT; t++) {
    for (let r = 0; r < nR; r++) {
      const v = acc[t * nR + r];
      if (v < minVotes) continue;
      let isMax = true;
      for (let dt = -4; dt <= 4 && isMax; dt++) {
        const tt = t + dt;
        if (tt < 0 || tt >= nT) continue;
        for (let dr = -6; dr <= 6; dr++) {
          const rr = r + dr;
          if (rr < 0 || rr >= nR || (dt === 0 && dr === 0)) continue;
          const o = acc[tt * nR + rr];
          if (o > v || (o === v && (dt < 0 || (dt === 0 && dr < 0)))) { isMax = false; break; }
        }
      }
      if (isMax) peaks.push({ t, r: r - diag, v });
    }
  }
  peaks.sort((a, b) => b.v - a.v);
  const verts = [];
  const hors = [];
  for (const p of peaks.slice(0, 120)) {
    const line = { c: cosT[p.t], s: sinT[p.t], r: p.r };
    if (p.t < 35 || p.t > 145) { if (verts.length < 18) verts.push(line); }
    else if (p.t > 55 && p.t < 125) { if (hors.length < 18) hors.push(line); }
  }
  if (verts.length < 2 || hors.length < 2) return null;
  const mX = w * 0.04;
  const mY = h * 0.04;
  let best = null;
  for (let i = 0; i < verts.length; i++) {
    for (let j = i + 1; j < verts.length; j++) {
      for (let k = 0; k < hors.length; k++) {
        for (let l = k + 1; l < hors.length; l++) {
          const raw = [intersect(verts[i], hors[k]), intersect(verts[j], hors[k]), intersect(verts[j], hors[l]), intersect(verts[i], hors[l])];
          if (raw.some((p) => !p || p.x < -mX || p.y < -mY || p.x > w + mX || p.y > h + mY)) continue;
          const q = orderQuad(raw);
          const shape = quadShape(q, w, h);
          if (!shape.ok || shape.af < 0.12) continue;
          const s = sideSupport(q, edge, w, h);
          if (s.min < 0.4 || s.mean < 0.55) continue;
          const score = s.mean * 0.7 + s.min * 0.3 + shape.af * 0.45 + shape.squareness * 0.1;
          if (!best || score > best.score) best = { q, score, support: s.mean };
        }
      }
    }
  }
  return best;
}

// --- method 2: region that differs from the background (photo border) ---
function kmeans(points, k, iters = 8) {
  const centers = [];
  for (let c = 0; c < k; c++) centers.push(points[Math.floor(((c + 0.5) / k) * points.length)].slice());
  const assign = new Uint8Array(points.length);
  for (let it = 0; it < iters; it++) {
    const sums = centers.map(() => [0, 0, 0, 0]);
    points.forEach((p, i) => {
      let bi = 0;
      let bd = Infinity;
      centers.forEach((c, ci) => {
        const d = (p[0] - c[0]) ** 2 + (p[1] - c[1]) ** 2 + (p[2] - c[2]) ** 2;
        if (d < bd) { bd = d; bi = ci; }
      });
      assign[i] = bi;
      const s = sums[bi];
      s[0] += p[0]; s[1] += p[1]; s[2] += p[2]; s[3]++;
    });
    sums.forEach((s, ci) => { if (s[3]) centers[ci] = [s[0] / s[3], s[1] / s[3], s[2] / s[3]]; });
  }
  return centers;
}

function convexHull(pts) {
  const p = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  if (p.length < 3) return p;
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lower = [];
  for (const q of p) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop(); lower.push(q); }
  const upper = [];
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop(); upper.push(q); }
  upper.pop(); lower.pop();
  return lower.concat(upper);
}

function maxAreaQuad(hull) {
  let H = hull;
  if (H.length > 64) { const step = H.length / 64; H = Array.from({ length: 64 }, (_, i) => hull[Math.floor(i * step)]); }
  const n = H.length;
  if (n < 4) return null;
  const tri = (a, b, c) => Math.abs((b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x)) / 2;
  let best = null;
  let bestA = 0;
  for (let i = 0; i < n; i++) {
    for (let k = i + 2; k < n; k++) {
      let bj = -1; let aj = 0;
      for (let j = i + 1; j < k; j++) { const a = tri(H[i], H[j], H[k]); if (a > aj) { aj = a; bj = j; } }
      let bl = -1; let al = 0;
      for (let l = k + 1; l < n + i; l++) { const L = l % n; if (L === i) continue; const a = tri(H[i], H[k], H[L]); if (a > al) { al = a; bl = L; } }
      if (bj < 0 || bl < 0) continue;
      if (aj + al > bestA) { bestA = aj + al; best = [H[i], H[bj], H[k], H[bl]]; }
    }
  }
  return best;
}

function fitLine(points) {
  const n = points.length;
  const mx = points.reduce((s, p) => s + p.x, 0) / n;
  const my = points.reduce((s, p) => s + p.y, 0) / n;
  let sxx = 0, syy = 0, sxy = 0;
  for (const p of points) { const dx = p.x - mx, dy = p.y - my; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; }
  const theta = 0.5 * Math.atan2(2 * sxy, sxx - syy); // direction of the line
  const nx = -Math.sin(theta), ny = Math.cos(theta);
  return { c: nx, s: ny, r: nx * mx + ny * my };
}

function quadFromRegion(P) {
  const { w, h, data, edge } = P;
  const N = w * h;
  const bw = Math.max(3, Math.round(Math.min(w, h) * 0.03));
  const border = [];
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (x >= bw && y >= bw && x < w - bw && y < h - bw) continue;
      if ((x + y) % 2) continue;
      const j = (y * w + x) * 4;
      border.push([data[j], data[j + 1], data[j + 2]]);
    }
  }
  const centers = kmeans(border, 3);
  const nearest = (r, g, b) => {
    let bd = Infinity;
    for (const c of centers) { const d = (r - c[0]) ** 2 + (g - c[1]) ** 2 + (b - c[2]) ** 2; if (d < bd) bd = d; }
    return Math.sqrt(bd);
  };
  const bd = border.map((p) => nearest(p[0], p[1], p[2])).sort((a, b) => a - b);
  const spread = bd[Math.floor(bd.length * 0.9)];
  const T = Math.max(26, spread * 1.8);

  let fg = new Uint8Array(N);
  for (let i = 0, j = 0; i < N; i++, j += 4) if (nearest(data[j], data[j + 1], data[j + 2]) > T) fg[i] = 1;

  // close small gaps: dilate then erode (square, radius 2)
  const morph = (src, dilate) => {
    const tmp = new Uint8Array(N);
    const out = new Uint8Array(N);
    const R = 2;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let v = dilate ? 0 : 1;
      for (let d = -R; d <= R; d++) { const xx = Math.min(w - 1, Math.max(0, x + d)); const s = src[y * w + xx]; if (dilate ? s : !s) { v = dilate ? 1 : 0; break; } }
      tmp[y * w + x] = v;
    }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let v = dilate ? 0 : 1;
      for (let d = -R; d <= R; d++) { const yy = Math.min(h - 1, Math.max(0, y + d)); const s = tmp[yy * w + x]; if (dilate ? s : !s) { v = dilate ? 1 : 0; break; } }
      out[y * w + x] = v;
    }
    return out;
  };
  fg = morph(morph(fg, true), false);

  // fill holes: background = not-fg reachable from the border
  const outside = new Uint8Array(N);
  const stack = [];
  for (let x = 0; x < w; x++) { stack.push(x, (h - 1) * w + x); }
  for (let y = 0; y < h; y++) { stack.push(y * w, y * w + w - 1); }
  while (stack.length) {
    const i = stack.pop();
    if (outside[i] || fg[i]) continue;
    outside[i] = 1;
    const x = i % w;
    if (x > 0) stack.push(i - 1);
    if (x < w - 1) stack.push(i + 1);
    if (i >= w) stack.push(i - w);
    if (i < N - w) stack.push(i + w);
  }
  for (let i = 0; i < N; i++) fg[i] = outside[i] ? 0 : 1;

  // largest connected component
  const label = new Int32Array(N).fill(-1);
  let bestLab = -1;
  let bestSize = 0;
  let lab = 0;
  for (let s = 0; s < N; s++) {
    if (!fg[s] || label[s] >= 0) continue;
    let size = 0;
    stack.push(s);
    label[s] = lab;
    while (stack.length) {
      const i = stack.pop();
      size++;
      const x = i % w;
      const nb = [x > 0 ? i - 1 : -1, x < w - 1 ? i + 1 : -1, i >= w ? i - w : -1, i < N - w ? i + w : -1];
      for (const j of nb) if (j >= 0 && fg[j] && label[j] < 0) { label[j] = lab; stack.push(j); }
    }
    if (size > bestSize) { bestSize = size; bestLab = lab; }
    lab++;
  }
  if (bestLab < 0 || bestSize < N * 0.1) return null;

  // outline points of the component
  const pts = [];
  for (let y = 0; y < h; y++) {
    let mn = -1, mx = -1;
    for (let x = 0; x < w; x++) if (label[y * w + x] === bestLab) { if (mn < 0) mn = x; mx = x; }
    if (mn >= 0) { pts.push({ x: mn, y }, { x: mx + 1, y }); }
  }
  for (let x = 0; x < w; x++) {
    let mn = -1, mx = -1;
    for (let y = 0; y < h; y++) if (label[y * w + x] === bestLab) { if (mn < 0) mn = y; mx = y; }
    if (mn >= 0) { pts.push({ x, y: mn }, { x, y: mx + 1 }); }
  }
  const hull = convexHull(pts);
  const rough = maxAreaQuad(hull);
  if (!rough) return null;
  let q = orderQuad(rough);

  // refine each side with a line fitted through nearby outline points
  const lines = [];
  for (let s = 0; s < 4; s++) {
    const a = q[s], b = q[(s + 1) % 4];
    const L = dist(a, b);
    const ux = (b.x - a.x) / L, uy = (b.y - a.y) / L;
    const near = pts.filter((p) => {
      const t = ((p.x - a.x) * ux + (p.y - a.y) * uy) / L;
      const d = Math.abs((p.x - a.x) * uy - (p.y - a.y) * ux);
      return t > 0.12 && t < 0.88 && d < Math.max(3, L * 0.03);
    });
    lines.push(near.length >= 8 ? fitLine(near) : null);
  }
  if (lines.every(Boolean)) {
    const refined = [intersect(lines[3], lines[0]), intersect(lines[0], lines[1]), intersect(lines[1], lines[2]), intersect(lines[2], lines[3])];
    if (refined.every((p) => p && p.x > -w * 0.05 && p.y > -h * 0.05 && p.x < w * 1.05 && p.y < h * 1.05)) q = orderQuad(refined);
  }
  const shape = quadShape(q, w, h);
  if (!shape.ok) return null;
  const fill = Math.min(1, bestSize / shape.area);
  const touches = [q.some((p) => p.x < 2), q.some((p) => p.y < 2), q.some((p) => p.x > w - 2), q.some((p) => p.y > h - 2)].filter(Boolean).length;
  const s = sideSupport(q, edge, w, h);
  return { q, fill, touches, support: s.mean, score: fill * 0.6 + s.mean * 0.4 + shape.af * 0.45 + shape.squareness * 0.1 };
}

/**
 * Find the outline of a (square-ish) cover in the photo.
 * Tries two methods (background-difference region, straight edge lines) and keeps the more convincing.
 * Returns {quad:[tl,tr,br,bl], confidence, method} in source pixel coords, or null.
 */
function detectQuad(src, dbg = null) {
  const P = prepare(src);
  let region = null;
  let lines = null;
  try { region = quadFromRegion(P); } catch (e) { region = null; }
  try { lines = quadFromLines(P); } catch (e) { lines = null; }
  if (dbg) { dbg.region = region && { q: region.q, fill: region.fill, support: region.support, touches: region.touches }; dbg.lines = lines && { q: lines.q, support: lines.support }; }

  let pick = null;
  const goodRegion = region && region.fill >= 0.9 && region.touches <= 1;
  if (goodRegion && lines && region.support < 0.8 && lines.support - region.support > 0.2) pick = { ...lines, method: 'lines' };
  else if (goodRegion) pick = { ...region, method: 'region' };
  else if (lines) pick = { ...lines, method: 'lines' };
  else if (region && region.fill >= 0.82 && region.touches === 0) pick = { ...region, method: 'region' };
  if (!pick) return null;

  // Pull the corners in very slightly so no background is left along the edges
  const cx = pick.q.reduce((a, p) => a + p.x, 0) / 4;
  const cy = pick.q.reduce((a, p) => a + p.y, 0) / 4;
  const quad = pick.q.map((p) => ({
    x: Math.max(0, Math.min(src.width, (p.x + (cx - p.x) * 0.008) / P.sc)),
    y: Math.max(0, Math.min(src.height, (p.y + (cy - p.y) * 0.008) / P.sc)),
  }));
  return { quad, confidence: Math.min(1, pick.method === 'region' ? pick.fill : pick.support), method: pick.method };
}

function defaultQuad(src, inset = 0.08) {
  const s = Math.min(src.width, src.height) * (1 - inset * 2);
  const x0 = (src.width - s) / 2;
  const y0 = (src.height - s) / 2;
  return [{ x: x0, y: y0 }, { x: x0 + s, y: y0 }, { x: x0 + s, y: y0 + s }, { x: x0, y: y0 + s }];
}

function fullQuad(src) {
  return [{ x: 0, y: 0 }, { x: src.width, y: 0 }, { x: src.width, y: src.height }, { x: 0, y: src.height }];
}

// ---------------------------------------------------------------------------
// Perspective warp
// ---------------------------------------------------------------------------

/** Projective map from the unit square (0,0),(1,0),(1,1),(0,1) to quad tl,tr,br,bl. */
function squareToQuad(q) {
  const [p0, p1, p2, p3] = q;
  const dx1 = p1.x - p2.x, dx2 = p3.x - p2.x, dx3 = p0.x - p1.x + p2.x - p3.x;
  const dy1 = p1.y - p2.y, dy2 = p3.y - p2.y, dy3 = p0.y - p1.y + p2.y - p3.y;
  let a, b, c, d, e, f, g, hh;
  if (Math.abs(dx3) < 1e-9 && Math.abs(dy3) < 1e-9) {
    a = p1.x - p0.x; b = p3.x - p0.x; c = p0.x;
    d = p1.y - p0.y; e = p3.y - p0.y; f = p0.y;
    g = 0; hh = 0;
  } else {
    const den = dx1 * dy2 - dx2 * dy1;
    g = (dx3 * dy2 - dx2 * dy3) / den;
    hh = (dx1 * dy3 - dx3 * dy1) / den;
    a = p1.x - p0.x + g * p1.x; b = p3.x - p0.x + hh * p3.x; c = p0.x;
    d = p1.y - p0.y + g * p1.y; e = p3.y - p0.y + hh * p3.y; f = p0.y;
  }
  return { a, b, c, d, e, f, g, h: hh };
}

/**
 * Straighten the quad into a rectangle. square=true forces a square output
 * (album covers). Output longest side is capped at OUTPUT_MAX.
 */
function warpQuad(src, quad, square = true) {
  const top = dist(quad[0], quad[1]); const bottom = dist(quad[3], quad[2]);
  const left = dist(quad[0], quad[3]); const right = dist(quad[1], quad[2]);
  let W = Math.max(top, bottom);
  let H = Math.max(left, right);
  if (square) { W = H = Math.max(W, H); }
  const s = Math.min(1, OUTPUT_MAX / Math.max(W, H));
  W = Math.max(64, Math.round(W * s));
  H = Math.max(64, Math.round(H * s));

  const sctx = src.getContext('2d', { willReadFrequently: true });
  const sd = sctx.getImageData(0, 0, src.width, src.height).data;
  const sw = src.width, sh = src.height;
  const out = makeCanvas(W, H);
  const octx = out.getContext('2d');
  const od = octx.createImageData(W, H);
  const o = od.data;
  const m = squareToQuad(quad);
  for (let y = 0; y < H; y++) {
    const v = (y + 0.5) / H;
    for (let x = 0; x < W; x++) {
      const u = (x + 0.5) / W;
      const den = m.g * u + m.h * v + 1;
      let fx = (m.a * u + m.b * v + m.c) / den - 0.5;
      let fy = (m.d * u + m.e * v + m.f) / den - 0.5;
      fx = Math.max(0, Math.min(sw - 1.001, fx));
      fy = Math.max(0, Math.min(sh - 1.001, fy));
      const x0 = fx | 0, y0 = fy | 0;
